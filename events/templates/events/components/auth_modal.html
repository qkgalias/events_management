<div id="auth-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeAuthModal()"></div>

    <div class="relative bg-white w-full max-w-[440px] rounded-2xl shadow-[0_25px_50px_-12px_rgba(0,0,0,0.15)] ring-1 ring-slate-900/5 overflow-hidden transform transition-all animate-in fade-in zoom-in duration-300">
        
        <button onclick="closeAuthModal()" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 transition-colors rounded-full hover:bg-slate-100 group z-20">
            <span class="material-symbols-outlined text-[20px] transition-transform group-hover:rotate-90">close</span>
        </button>

        <div id="login-form-container">
            {% include 'events/components/login_form.html' %}
            
            <div class="relative mt-2 mb-6 px-8">
                <div class="absolute inset-0 flex items-center px-8">
                    <div class="w-full border-t border-gray-100"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase tracking-widest font-bold">
                    <span class="px-4 bg-white text-slate-400">or</span>
                </div>
            </div>
            
            <div class="px-8 py-5 bg-slate-50 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500 font-sans">
                    New to TechHub? 
                    <button onclick="toggleAuthMode('signup')" class="font-bold text-slate-900 hover:text-primary transition-colors ml-1 inline-flex items-center gap-0.5">
                        Create an account
                    </button>
                </p>
            </div>
        </div>

        <div id="signup-form-container" class="hidden">
            {% include 'events/components/signup_form.html' %}
            
                        <div class="relative mt-2 mb-6 px-8">
                <div class="absolute inset-0 flex items-center px-8">
                    <div class="w-full border-t border-gray-100"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase tracking-widest font-bold">
                    <span class="px-4 bg-white text-slate-400">or</span>
                </div>
            </div>
            
            <div class="px-8 py-5 bg-slate-50 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500 font-sans">
                    Already have an account? 
                    <button onclick="toggleAuthMode('login')" class="font-bold text-slate-900 hover:text-primary transition-colors ml-1 inline-flex items-center gap-0.5">
                        Sign in instead
                    </button>
                </p>
            </div>
        </div>

        <div class="h-1 w-full bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
    </div>
</div>
