<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Admin Dashboard</h1>
            <form action="{% url 'logout' %}" method="post"> {% csrf_token %}
                <button type="submit" class="btn btn-danger">Logout</button>
            </form>
        </div>
        <div class="row mb-4 text-center">
            <div class="col-md-6"><div class="card p-3 bg-primary text-white"><h5>Events</h5><h2>{{ stats.total_events }}</h2></div></div>
            <div class="col-md-6"><div class="card p-3 bg-success text-white"><h5>Registrations</h5><h2>{{ stats.total_registrations }}</h2></div></div>
        </div>
        <table class="table bg-white shadow-sm">
            <thead><tr><th>Event Title</th><th>Location</th><th>Status</th></tr></thead>
            <tbody>
                {% for event in events %}
                <tr><td>{{ event.title }}</td><td>{{ event.location }}</td><td>{{ event.status }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
