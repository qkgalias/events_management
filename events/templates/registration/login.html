<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 flex items-center p-4 text-sm rounded-lg {% if message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200{% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}" role="alert">
                    <svg class="flex-shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
                    </svg>
                    <div>
                        <span class="font-medium">Notification:</span> {{ message }}
                    </div>
                </div>
            {% endfor %}
        {% endif %}

        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
            <h3 class="text-3xl font-bold text-gray-900 text-center mb-6">Login</h3>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div class="space-y-4 text-gray-700">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200 shadow-lg shadow-blue-200">
                    Sign In
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-100 text-center">
                <p class="text-gray-600">New here? 
                    <a href="{% url 'signup' %}" class="text-blue-600 font-semibold hover:underline">Create account</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
