<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TechHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
            <h3 class="text-3xl font-bold text-gray-900 text-center mb-6">Create Account</h3>
            
            {% if form.errors %}
                <div class="mb-6 p-4 text-sm text-red-800 rounded-lg bg-red-50 border border-red-200" role="alert">
                    <div class="font-medium">Please correct the following errors:</div>
                    <ul class="mt-1.5 list-disc list-inside">
                        {% for field, errors in form.errors.items %}
                            {% for error in errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div class="space-y-4 text-gray-700">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200 shadow-lg shadow-blue-200">
                    Register
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-100 text-center">
                <p class="text-gray-600">Already have an account? 
                    <a href="{% url 'login' %}" class="text-blue-600 font-semibold hover:underline">Login here</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
